# docker-compose.yml
services:
  mysql:
    image: mysql:8.0              # ใช้ MySQL เวอร์ชัน 8.0
    container_name: retireplan-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass    # รหัส root
      MYSQL_DATABASE: retireplan       # ชื่อ database ที่จะสร้างอัตโนมัติ
      MYSQL_USER: appuser              # user สำหรับแอปเรา
      MYSQL_PASSWORD: apppass          # รหัสของ appuser
    ports:
      - "3306:3306"               # เปิด port 3306 ให้เครื่องเราต่อเข้าไปได้
    volumes:
      - mysql_data:/var/lib/mysql # เก็บข้อมูลไว้ ไม่หายเวลาปิด container

volumes:
  mysql_data:                     # พื้นที่เก็บข้อมูลถาวร